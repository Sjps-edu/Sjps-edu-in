<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Khoushalyaa</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #1a0505, #3d0a0a, #1a0505);
            overflow: hidden; /* Prevents horizontal scrolling */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-tap-highlight-color: transparent;
        }

        /* The hidden message in the center */
        .center-message {
            color: #ff4d6d;
            font-size: 3rem;
            font-weight: bold;
            text-shadow: 0 0 20px #ff0033, 0 0 40px #ff0033;
            z-index: 10;
            animation: pulse 2s infinite alternate;
            text-align: center;
            padding: 0 20px; /* Adds spacing on small screens */
        }

        @keyframes pulse {
            from { transform: scale(1); opacity: 0.8; }
            to { transform: scale(1.1); opacity: 1; }
        }

        /* The falling text container */
        .falling-item {
            position: absolute;
            top: -50px;
            white-space: nowrap;
            color: #ff758f;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 0, 51, 0.7);
            animation: fallDown linear forwards;
            opacity: 0.9;
        }

        /* The falling heart emoji container */
        .falling-heart {
            position: absolute;
            top: -50px;
            font-size: 30px;
            animation: fallDown linear forwards;
        }

        /* Animation for falling */
        @keyframes fallDown {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0.3;
            }
        }

        /* --- MOBILE COMPATIBILITY --- */
        @media (max-width: 768px) {
            .center-message {
                font-size: 2rem; /* Smaller text for phones */
                text-shadow: 0 0 10px #ff0033, 0 0 20px #ff0033; /* Lighter shadow for mobile performance */
            }
        }
    </style>
</head>
<body>

    <div class="center-message">Forever Yours ❤️</div>

    <script>
        const phrases = [
            "I love you Khoushalyaa",
            "Khoushalyaa ❤️",
            "My Heart Khoushalyaa",
            "I love you Khoushalyaa"
        ];

        // Function to create a falling element
        function createFallingItem() {
            // Randomly decide if it's a text phrase or a heart (50% chance)
            const isText = Math.random() > 0.4;
            const item = document.createElement('div');
            
            // Check if the user is on a mobile device based on screen width
            const isMobile = window.innerWidth <= 768;

            if (isText) {
                item.className = 'falling-item';
                // Pick a random phrase from the array
                item.innerText = phrases[Math.floor(Math.random() * phrases.length)];
                
                // Smaller font sizes for mobile so text doesn't overlap too much
                const minSize = isMobile ? 14 : 18;
                const maxSize = isMobile ? 22 : 32;
                const size = Math.random() * (maxSize - minSize) + minSize;
                item.style.fontSize = size + 'px';
            } else {
                item.className = 'falling-heart';
                item.innerText = '❤️';
                
                // Smaller hearts on mobile
                const minSize = isMobile ? 16 : 20;
                const maxSize = isMobile ? 28 : 40;
                const size = Math.random() * (maxSize - minSize) + minSize;
                item.style.fontSize = size + 'px';
            }

            // Random horizontal position (5% to 95% of screen width to prevent edge cutoff)
            const leftPosition = Math.random() * 90 + 5;
            item.style.left = leftPosition + 'vw';

            // Random animation duration between 4 and 8 seconds
            const duration = Math.random() * 4 + 4;
            item.style.animationDuration = duration + 's';

            // Add to body
            document.body.appendChild(item);

            // Remove the item after it finishes falling to prevent memory leaks
            setTimeout(() => {
                item.remove();
            }, duration * 1000);
        }

        // Create a new falling item every 300 milliseconds
        setInterval(createFallingItem, 300);
    </script>
</body>
</html>
